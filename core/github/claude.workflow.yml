# Claude Code in this repository (anthropics/claude-code-action). Two ways in:
#  * Admin → Feedback → status "Start the build with Claude" opens an issue here that
#    mentions @claude (core/src/lib/feedback-build.ts, SETUP-GUIDE Part 17).
#  * Anyone with write access writes @claude in an issue or a pull request comment.
# Claude works on a branch (claude/…) and opens a pull request; it never merges.
# Needs the Claude GitHub App on the repository and the secret ANTHROPIC_API_KEY
# (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`; swap the line below).
# Template kept in core: copy it to .github/workflows/claude.yml in the product repository.
name: Claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 80"
